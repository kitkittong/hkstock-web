<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Quant Master Pro - 專業操盤手版</title>
    <style>
        :root { --bg-dark: #1e222d; --panel-bg: #2a2e39; --text-main: #d1d4dc; --accent: #2962ff; --up-color: #f23645; --down-color: #089981; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: var(--bg-dark); color: var(--text-main); }
        .dashboard { display: flex; gap: 15px; margin-bottom: 15px; }
        .kpi-card { background: var(--panel-bg); padding: 15px; border-radius: 6px; flex: 1; border-left: 4px solid var(--accent); }
        .kpi-title { font-size: 12px; color: #8a93a6; margin-bottom: 5px; }
        .kpi-value { font-size: 20px; font-weight: bold; color: white; }
        .up-text { color: var(--up-color); }
        .down-text { color: var(--down-color); }
        
        .container { display: flex; gap: 15px; height: calc(100vh - 120px); }
        .left-panel { flex: 1; background: var(--panel-bg); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 12px 15px; background: #232631; font-weight: bold; border-bottom: 1px solid #363c4e; display: flex; justify-content: space-between;}
        
        .table-container { overflow-y: auto; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #232631; color: #8a93a6; padding: 10px; text-align: left; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px; border-bottom: 1px solid #363c4e; cursor: pointer; }
        tr:hover { background-color: #363c4e; }
        tr.selected { background-color: rgba(41, 98, 255, 0.1); border-left: 3px solid var(--accent); }
        
        .right-panel { flex: 1.5; display: flex; flex-direction: column; gap: 15px; }
        .chart-box { background: var(--panel-bg); border-radius: 6px; flex: 2; min-height: 400px; padding: 10px; }
        .tools-box { background: var(--panel-bg); border-radius: 6px; flex: 1; padding: 15px; }
        
        .sector-tag { background: #363c4e; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #b2b5be; }
        .badge-red { color: var(--up-color); font-weight: bold; }
        .badge-green { color: var(--down-color); font-weight: bold; }
        .badge-gray { color: #8a93a6; }
        
        .btn { background: #363c4e; color: white; border: 1px solid #434651; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; font-size: 12px; }
        .btn:hover { background: #434651; }
        select { background: #232631; color: white; border: 1px solid #434651; padding: 4px; border-radius: 4px; }
    </style>
</head>
<body>
    <!-- 頂部大盤與板塊儀表板 -->
    <div class="dashboard">
        <div class="kpi-card" style="border-left-color: #f23645;">
            <div class="kpi-title">大盤環境 (HSI)</div>
            <div class="kpi-value" id="hsiDisplay">載入中...</div>
        </div>
        <div class="kpi-card" style="border-left-color: #e1b303;">
            <div class="kpi-title">🔥 現正轉強板塊 (動能 Top 3)</div>
            <div class="kpi-value" id="strongSectorsDisplay" style="font-size: 16px; margin-top:5px;">載入中...</div>
        </div>
        <div class="kpi-card" style="border-left-color: #2962ff;">
            <div class="kpi-title">系統狀態</div>
            <div class="kpi-value" id="updateTime" style="font-size: 14px; margin-top:5px;">載入數據中...</div>
        </div>
    </div>

    <div class="container">
        <!-- 左側：多因子股票掃描清單 -->
        <div class="left-panel">
            <div class="panel-header">
                <span>📊 港股多因子掃描清單</span>
                <select id="sectorFilter" onchange="filterSector()">
                    <option value="ALL">顯示全部板塊</option>
                </select>
            </div>
            <div class="table-container">
                <table id="stockTable">
                    <thead><tr><th>代碼</th><th>名稱</th><th>所屬板塊</th><th>現價</th><th>策略訊號</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 右側：技術圖表與兄弟股分析 -->
        <div class="right-panel">
            <div class="chart-box" id="tradingview_chart"></div>
            
            <div class="tools-box">
                <h3 style="margin-top:0; color:#fff;">⚡ 操盤手工作台：<span id="selectedStockName" style="color:var(--accent)">請選擇股票</span></h3>
                <p id="brotherStocksInfo" style="color:#8a93a6; font-size:13px; line-height: 1.5;"></p>
                <div style="margin-top: 15px;">
                    <button class="btn" onclick="triggerAI('perplexity')">🔍 Perplexity 深度基本面分析</button>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let allStocks = [];
        let currentIndex = 0;

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('updateTime').innerText = `最後更新: ${data.update_time}`;
                
                // 渲染 HSI 大盤
                const hsiClass = data.hsi.change_pct >= 0 ? 'up-text' : 'down-text';
                const hsiSign = data.hsi.change_pct >= 0 ? '+' : '';
                document.getElementById('hsiDisplay').innerHTML = `<span class="${hsiClass}">${data.hsi.price} (${hsiSign}${data.hsi.change_pct}%)</span>`;
                
                // 渲染轉強板塊
                const sectorsHtml = data.strong_sectors.map(s => `<span class="sector-tag" style="background:#e1b303; color:#000;">${s.sector}</span>`).join(' ');
                document.getElementById('strongSectorsDisplay').innerHTML = sectorsHtml || "無明顯強勢板塊";

                allStocks = data.stocks;
                
                // 產生板塊過濾器選單
                const sectors = [...new Set(allStocks.map(s => s.sector))];
                const filter = document.getElementById('sectorFilter');
                sectors.forEach(sec => {
                    const opt = document.createElement('option');
                    opt.value = sec; opt.innerText = `只看：${sec}`;
                    filter.appendChild(opt);
                });

                renderTable(allStocks);
                if(allStocks.length > 0) selectStock(0, allStocks);
            });

        function renderTable(stocksToRender) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            stocksToRender.forEach((stock, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                tr.innerHTML = `
                    <td>${stock.code}</td>
                    <td style="font-weight:bold; color:#fff;">${stock.name}</td>
                    <td><span class="sector-tag">${stock.sector}</span></td>
                    <td>$${stock.price}</td>
                    <td><span class="${stock.badge}">${stock.signal}</span></td>
                `;
                tr.onclick = () => selectStock(index, stocksToRender);
                tbody.appendChild(tr);
            });
        }

        function filterSector() {
            const selected = document.getElementById('sectorFilter').value;
            const filtered = selected === "ALL" ? allStocks : allStocks.filter(s => s.sector === selected);
            renderTable(filtered);
            if(filtered.length > 0) selectStock(0, filtered);
        }

        function selectStock(index, currentList) {
            const oldRow = document.querySelector('tr.selected');
            if(oldRow) oldRow.classList.remove('selected');
            
            currentIndex = index;
            const newRow = document.getElementById(`row-${currentIndex}`);
            if(newRow) newRow.classList.add('selected');
            
            const stock = currentList[currentIndex];
            document.getElementById('selectedStockName').innerText = `${stock.name} (${stock.code})`;

            // 尋找同板塊偽兄弟股
            const brothers = allStocks.filter(s => s.sector === stock.sector && s.code !== stock.code);
            let brotherText = `<strong>板塊連動分析：</strong>該股屬於【${stock.sector}】板塊。<br>`;
            if (brothers.length > 0) {
                brotherText += `同板塊走勢相近的「偽兄弟股」有：` + brothers.map(b => `<span style="color:#fff;">${b.name} (${b.code})</span>`).join('、');
                brotherText += `。操盤建議：可觀察同板塊資金是否出現共振，若領頭羊突破，兄弟股有機會跟上。`;
            } else {
                brotherText += `目前監控清單中暫無同板塊兄弟股。`;
            }
            document.getElementById('brotherStocksInfo').innerHTML = brotherText;

            // 更新 TradingView (加入 HSI 比較線)
            document.getElementById('tradingview_chart').innerHTML = '';
            new TradingView.widget({
                "autosize": true, "symbol": stock.symbol, "interval": "D", "timezone": "Asia/Hong_Kong",
                "theme": "dark", "style": "1", "locale": "zh_TW", "enable_publishing": false,
                "allow_symbol_change": false, "container_id": "tradingview_chart",
                "studies": ["RSI@tv-basicstudies", "MACD@tv-basicstudies"] // 專業版預設加入 RSI 和 MACD
            });
        }

        function triggerAI(aiType) {
            const stock = allStocks[currentIndex];
            const prompt = `作為專業港股操盤手，請幫我分析 ${stock.name}(${stock.code})。目前所屬的【${stock.sector}】板塊是否正在轉強？請結合資金流與基本面給出簡短建議。`;
            navigator.clipboard.writeText(prompt).then(() => {
                alert(`已複製專業分析提示詞！\n即將為您打開 Perplexity，請按 Ctrl+V 貼上發問。`);
                window.open("https://www.perplexity.ai/", '_blank');
            });
        }
    </script>
</body>
</html>
