<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Quant Master V10.10 Pro (自動更新版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .container { display: flex; gap: 20px; }
        .left-panel { flex: 1; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-y: auto; max-height: 80vh; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; }
        th { background-color: #f8f9fa; }
        tr.selected { background-color: #e6f7ff; font-weight: bold; border-left: 4px solid #1890ff; }
        tr:hover { background-color: #f0f0f0; }
        .chart-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: 400px; }
        .ai-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; margin-right: 10px; }
        .btn-gemini { background-color: #4285F4; }
        .btn-grok { background-color: #000000; }
        .btn-perplexity { background-color: #22B8CD; }
        .badge-red { background: #ff4d4f; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
        .badge-green { background: #52c41a; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
        .badge-gray { background: #8c8c8c; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>📊 HK Quant Master V10.10 Pro</h2>
        <p id="updateTime">數據載入中... | 提示: 使用鍵盤 ↑ ↓ 極速切換圖表</p>
    </div>
    <div class="container">
        <div class="left-panel">
            <table id="stockTable">
                <thead><tr><th>股票代號</th><th>名稱</th><th>現價</th><th>策略訊號</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="4">載入最新真實數據中...</td></tr></tbody>
            </table>
        </div>
        <div class="right-panel">
            <div class="chart-box" id="tv_chart_container"><div id="tradingview_chart" style="height: 100%;"></div></div>
            <div class="ai-box">
                <h3>🤖 三大 AI 聯合診斷 (複製數據並開啟)</h3>
                <p id="selectedDataText" style="color: gray;">請先選擇左側股票</p>
                <button class="btn btn-gemini" onclick="triggerAI('gemini')">✨ 開啟 Gemini</button>
                <button class="btn btn-grok" onclick="triggerAI('grok')">✖️ 開啟 Grok</button>
                <button class="btn btn-perplexity" onclick="triggerAI('perplexity')">🔍 開啟 Perplexity</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let stocks = [];
        let currentIndex = 0;

        // 自動去讀取 Python 產生的 json 檔案
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('updateTime').innerText = `最後更新時間: ${data.update_time} | 提示: 使用鍵盤 ↑ ↓ 極速切換圖表`;
                stocks = data.stocks;
                renderTable();
                if(stocks.length > 0) selectStock(0);
            })
            .catch(error => {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="color:red;">請先執行自動更新腳本產生數據檔案！</td></tr>';
            });

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            stocks.forEach((stock, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                tr.innerHTML = `<td>${stock.code}</td><td>${stock.name}</td><td>$${stock.price}</td><td><span class="${stock.badge}">${stock.signal}</span></td>`;
                tr.onclick = () => selectStock(index);
                tbody.appendChild(tr);
            });
        }

        function selectStock(index) {
            const oldRow = document.getElementById(`row-${currentIndex}`);
            if(oldRow) oldRow.classList.remove('selected');
            currentIndex = index;
            document.getElementById(`row-${currentIndex}`).classList.add('selected');
            
            const stock = stocks[currentIndex];
            document.getElementById('selectedDataText').innerText = `已選擇: ${stock.code} ${stock.name} - 現價 $${stock.price} (${stock.signal})`;

            document.getElementById('tradingview_chart').innerHTML = '';
            new TradingView.widget({
                "autosize": true, "symbol": stock.symbol, "interval": "D", "timezone": "Asia/Hong_Kong",
                "theme": "light", "style": "1", "locale": "zh_TW", "enable_publishing": false,
                "allow_symbol_change": false, "container_id": "tradingview_chart"
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); if (currentIndex < stocks.length - 1) selectStock(currentIndex + 1); } 
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (currentIndex > 0) selectStock(currentIndex - 1); }
        });

        function triggerAI(aiType) {
            const stock = stocks[currentIndex];
            const prompt = `請幫我以量化及技術分析的角度，診斷港股 ${stock.code} (${stock.name})，目前現價為 ${stock.price}，並且觸發了「${stock.signal}」訊號。`;
            navigator.clipboard.writeText(prompt).then(() => {
                alert(`已將數據複製！\n即將為您打開 ${aiType}，請直接按 Ctrl+V 或 Cmd+V 貼上並發問。`);
                let url = aiType === 'gemini' ? "https://gemini.google.com/" : (aiType === 'grok' ? "https://grok.com/" : "https://www.perplexity.ai/");
                window.open(url, '_blank');
            });
        }
    </script>
</body>
</html>
