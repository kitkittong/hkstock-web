name: Daily HK Stock Update

on:
  schedule:
    # 每天香港時間下午 16:30 執行
    - cron: '30 8 * * *'
  workflow_dispatch:

# 新增這段：明確賦予機器人寫入檔案的權限
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    # 升級到 v4 (解決 Node.js 警告)
    - name: 下載您的程式碼
      uses: actions/checkout@v4

    # 升級到 v5 (解決 Node.js 警告)
    - name: 安裝 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝量化套件
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz

    - name: 執行自動抓取數據
      run: python update_data.py

    - name: 將最新數據儲存並推送到您的網站
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add data.json
        git commit -m "自動更新最新股價" || exit 0
        git push
