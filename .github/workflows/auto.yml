name: Daily HK Stock Update

on:
  schedule:
    # 每天 UTC 時間 08:30 執行 (等於香港時間下午 16:30，港股收市後更新)
    - cron: '30 8 * * *'
  workflow_dispatch: # 加入這行，允許我們手動點擊按鈕來執行測試

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 下載您的程式碼
      uses: actions/checkout@v3

    - name: 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝量化套件
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz

    - name: 執行自動抓取數據
      run: python update_data.py

    - name: 將最新數據儲存並推送到您的網站
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add data.json
        git commit -m "自動更新最新股價" || exit 0
        git push
