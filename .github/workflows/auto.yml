name: Daily HK Stock Update

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # 加入這行環境變數，強制套件使用最新的 Node 24 執行環境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: 下載您的程式碼
      uses: actions/checkout@v4

    - name: 安裝 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝量化套件
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz

    - name: 執行自動抓取數據
      run: python update_data.py

    - name: 將最新數據儲存並推送到您的網站
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add data.json
        git commit -m "自動更新最新股價" || exit 0
        git push
